name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r agent/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/verify_local.py
  investigator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r agent/requirements.txt
      - run: python -m unittest discover -s agent -p 'test*.py'
      - name: Verify Holmes tools without provider access
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD/agent/verify_holmes_snapshot.py:/contract/verify.py:ro" \
            -v "$PWD/agent/holmes-observations.yaml:/contract/holmes-observations.yaml:ro" \
            robustadev/holmes:0.46.0@sha256:bec9d14eea6a8890ba498c91ab47adcce3af9b6d0c6ee26d642d4e3e0df6218e /contract/verify.py
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/init_env.py
      - run: docker compose --profile holmes config --quiet
      - run: docker compose up --build --wait --wait-timeout 150
      - run: python scripts/e2e.py --env-file .env
