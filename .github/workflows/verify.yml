name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r agent/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/verify_local.py
  investigator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r agent/requirements.txt
      - run: python -m unittest discover -s agent -p 'test*.py'
      - name: Verify Holmes tools without provider access
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD/agent/verify_holmes_snapshot.py:/contract/verify.py:ro" \
            -v "$PWD/agent/holmes-observations.yaml:/contract/holmes-observations.yaml:ro" \
            robustadev/holmes:0.46.0@sha256:bec9d14eea6a8890ba498c91ab47adcce3af9b6d0c6ee26d642d4e3e0df6218e /contract/verify.py
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/init_env.py
      - run: docker compose --profile holmes config --quiet
      - run: docker compose up --build --wait --wait-timeout 150
      - run: python scripts/e2e.py --env-file .env
      - name: Scan candidate images
        run: |
          mkdir -p /tmp/image-scan
          docker save causelume-app -o /tmp/image-scan/app.tar
          docker save causelume-agent -o /tmp/image-scan/agent.tar
          failed=0
          for image in app agent; do
            docker run --rm -v /tmp/trivy-cache:/root/.cache/trivy -v /tmp/image-scan:/scan aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --input /scan/${image}.tar --format json --output /scan/${image}.json --severity HIGH,CRITICAL --exit-code 1 || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-image-scan
          path: /tmp/image-scan/*.json

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: python scripts/verify_postgres.py
      - run: mvn -B -f backend/pom.xml -DskipTests package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r agent/requirements.txt
      - run: python scripts/test_candidate_ready.py
      - run: python scripts/verify_candidate.py
      - run: python scripts/verify_backup.py
      - run: python scripts/test_release.py

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r agent/requirements.txt
      - run: python agent/verify_observability.py
      - run: python agent/verify_alertmanager.py
      - run: docker compose --env-file production.env.example -f compose.production.yaml -f compose.observability.yaml --profile maintenance --profile restore config --quiet

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
      - run: python -m pip install pip-audit && pip-audit -r agent/requirements.txt
      - name: Check repository secrets
        run: docker run --rm -v "$PWD:/source:ro" aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb fs --scanners secret --offline-scan --exit-code 1 /source
