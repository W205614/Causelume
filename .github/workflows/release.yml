name: Prepare or publish candidate images
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Validated candidate run to publish; leave empty to build without pushing"
        required: false
        type: string
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  # Version aliases are shared across commits, so their check/push must be serialized.
  group: causelume-images-${{ github.repository }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Initialize offline acceptance configuration
        run: python scripts/init_env.py
      - name: Verify image content identity parsing
        run: python scripts/test_image_identity.py
      - name: Build release images
        if: inputs.candidate_run_id == ''
        run: |
          version=$(python -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          docker build --label org.opencontainers.image.revision=$GITHUB_SHA --label org.opencontainers.image.version=$version -t ghcr.io/w205614/causelume-app:${GITHUB_SHA} .
          docker build -f agent/Dockerfile --label org.opencontainers.image.revision=$GITHUB_SHA --label org.opencontainers.image.version=$version -t ghcr.io/w205614/causelume-agent:${GITHUB_SHA} .
      - name: Exercise the exact images before publishing
        if: inputs.candidate_run_id == ''
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          prefix = 'ghcr.io/w205614/causelume-'
          Path('/tmp/release-images.json').write_text(json.dumps({'services': {
            'app': {'image': prefix + 'app:' + os.environ['GITHUB_SHA']},
            'agent': {'image': prefix + 'agent:' + os.environ['GITHUB_SHA']},
            'checkout': {'image': prefix + 'agent:' + os.environ['GITHUB_SHA']}}}))
          PY
          docker compose -p causelume-release -f compose.yaml -f /tmp/release-images.json up -d --no-build --wait --wait-timeout 180 app agent checkout
          python scripts/e2e.py --env-file .env
      - name: Scan application images
        if: inputs.candidate_run_id == ''
        run: |
          docker save ghcr.io/w205614/causelume-app:${GITHUB_SHA} -o /tmp/app.tar
          docker save ghcr.io/w205614/causelume-agent:${GITHUB_SHA} -o /tmp/agent.tar
          failed=0
          for image in app agent; do
            docker run --rm -v /tmp/trivy-cache:/root/.cache/trivy -v /tmp:/scan aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --input /scan/${image}.tar --format json --output /scan/${image}-scan.json --exit-code 1 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL || failed=1
          done
          exit "$failed"
      - name: Collect corresponding sources and candidate checksums
        if: inputs.candidate_run_id == ''
        run: |
          version=$(python -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          python scripts/collect_image_sources.py --app ghcr.io/w205614/causelume-app:${GITHUB_SHA} --agent ghcr.io/w205614/causelume-agent:${GITHUB_SHA} --app-archive /tmp/app.tar --agent-archive /tmp/agent.tar --version "$version" --output /tmp/sources
          cp /tmp/sources/manifest.json /tmp/source-manifest.json
          printf '%s\n' "$GITHUB_SHA" > /tmp/commit.txt
          cd /tmp
          sha256sum app.tar agent.tar app-scan.json agent-scan.json source-manifest.json commit.txt causelume-v*-third-party-sources.zip > candidate-SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.candidate_run_id == ''
        with:
          name: candidate-metadata
          path: |
            /tmp/source-manifest.json
            /tmp/commit.txt
            /tmp/candidate-SHA256SUMS
            /tmp/app-scan.json
            /tmp/agent-scan.json
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.candidate_run_id == ''
        with:
          name: release-candidate
          retention-days: 7
          path: |
            /tmp/app.tar
            /tmp/agent.tar
            /tmp/source-manifest.json
            /tmp/commit.txt
            /tmp/candidate-SHA256SUMS
            /tmp/app-scan.json
            /tmp/agent-scan.json
            /tmp/causelume-v*-third-party-sources.zip
      - name: Validate the candidate run
        if: inputs.candidate_run_id != ''
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          run_id = os.environ['CANDIDATE_RUN']
          assert run_id.isdecimal(), 'candidate_run_id must be numeric'
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + run_id,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'Causelume-release'})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          assert run['conclusion'] == 'success' and run['head_sha'] == os.environ['GITHUB_SHA'], 'Candidate did not pass for this commit'
          assert run['path'] == '.github/workflows/release.yml' and run['event'] == 'workflow_dispatch', 'Unexpected candidate workflow'
          PY
      - uses: actions/download-artifact@v8.0.2
        if: inputs.candidate_run_id != ''
        with:
          name: release-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify and load the validated candidate
        if: inputs.candidate_run_id != ''
        run: |
          cd candidate
          sha256sum -c candidate-SHA256SUMS
          test "$(cat commit.txt)" = "$GITHUB_SHA"
          docker load -i app.tar
          docker load -i agent.tar
          for image in app agent; do
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' ghcr.io/w205614/causelume-${image}:${GITHUB_SHA})" = "$GITHUB_SHA"
          done
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('../scripts').resolve()))
          from image_identity import archive_identity
          manifest = json.load(open('source-manifest.json'))
          assert manifest['version'] == json.load(open('../frontend/package.json'))['version'], 'Candidate version mismatch'
          for name, expected in manifest['imageContent'].items():
              actual = archive_identity(Path(name + '.tar'), 'ghcr.io/w205614/causelume-' + name + ':' + os.environ['GITHUB_SHA'])
              assert actual == expected, name
          PY
      - name: Push and record immutable references
        if: inputs.candidate_run_id != ''
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version=$(python -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          for image in app agent; do
            source=ghcr.io/w205614/causelume-${image}:${GITHUB_SHA}
            for alias in commit version; do
              tag=$GITHUB_SHA
              if [ "$alias" = version ]; then tag=v${version}; fi
              target=ghcr.io/w205614/causelume-${image}:${tag}
              if docker manifest inspect "$target" > /tmp/existing.json 2> /tmp/manifest-error; then
                echo 'Existing immutable tag found; verifying its pulled content before reuse'
              elif grep -Eiq 'manifest unknown|no such manifest|name unknown' /tmp/manifest-error; then
                if [ "$target" != "$source" ]; then docker tag "$source" "$target"; fi
                docker push "$target"
              else
                cat /tmp/manifest-error >&2
                exit 1
              fi
              docker pull "$target"
              docker save "$target" -o /tmp/published-${image}-${alias}.tar
              python scripts/image_identity.py /tmp/published-${image}-${alias}.tar "$target" --expected-manifest candidate/source-manifest.json --component "$image" > ${image}-${alias}-content.json
              docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' > /tmp/${image}-${alias}-manifest.json
            done
          done
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          version = json.load(open('frontend/package.json'))['version']
          result = {'commit': os.environ['GITHUB_SHA'], 'version': version, 'images': {}}
          for name in ('app', 'agent'):
              repository = 'ghcr.io/w205614/causelume-' + name
              result['images'][name] = {}
              for alias, tag in (('commit', os.environ['GITHUB_SHA']), ('version', 'v' + version)):
                  target = repository + ':' + tag
                  descriptor = json.load(open('/tmp/' + name + '-' + alias + '-manifest.json'))
                  reference = repository + '@' + descriptor['digest']
                  inspected = json.loads(subprocess.check_output(['docker', 'image', 'inspect', target]))[0]
                  assert reference in inspected['RepoDigests'], 'Registry digest not present in pulled image: ' + target
                  Path(name + '-' + alias + '-image.txt').write_text(reference + '\n')
                  content = json.load(open(name + '-' + alias + '-content.json'))
                  result['images'][name][alias] = {'tag': tag, 'reference': target, 'registryReference': reference, 'content': content}
              # Legacy receipts identify the immutable full-commit alias.
              Path(name + '-image.txt').write_bytes(Path(name + '-commit-image.txt').read_bytes())
              Path(name + '-content.json').write_bytes(Path(name + '-commit-content.json').read_bytes())
          Path('images.json').write_text(json.dumps(result, indent=2) + '\n')
          Path('version.txt').write_text(version + '\n')
          PY
          printf '%s\n' "$GITHUB_SHA" > commit.txt
      - name: Exercise the published default Compose images
        if: inputs.candidate_run_id != ''
        run: |
          python - <<'PY'
          import json, subprocess
          version = json.load(open('frontend/package.json'))['version']
          config = json.loads(subprocess.check_output(['docker', 'compose', '-p', 'causelume-release', '-f', 'compose.yaml', 'config', '--format', 'json']))
          assert set(config['services']) == {'app', 'agent', 'checkout'}, 'Unexpected default services'
          for name in ('app', 'agent', 'checkout'):
              component = 'app' if name == 'app' else 'agent'
              assert config['services'][name]['image'] == 'ghcr.io/w205614/causelume-' + component + ':v' + version, name
              assert 'build' not in config['services'][name], name
          for name in ('app', 'agent'):
              assert config['services'][name]['environment']['AGENT_MODE'] == 'offline', name
          PY
          docker compose -p causelume-release -f compose.yaml pull app agent checkout
          docker compose -p causelume-release -f compose.yaml up -d --no-build --wait --wait-timeout 180 app agent checkout
          python scripts/e2e.py --env-file .env --expect-mode offline
      - name: Stop the disposable acceptance stack
        if: always()
        run: |
          if [ ! -f .env ]; then exit 0; fi
          if [ -f /tmp/release-images.json ]; then
            docker compose -p causelume-release -f compose.yaml -f /tmp/release-images.json down --volumes
          else
            docker compose -p causelume-release -f compose.yaml down --volumes
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always() && inputs.candidate_run_id != ''
        with:
          name: release-manifest
          path: |
            app-image.txt
            agent-image.txt
            app-content.json
            agent-content.json
            app-commit-image.txt
            agent-commit-image.txt
            app-version-image.txt
            agent-version-image.txt
            app-commit-content.json
            agent-commit-content.json
            app-version-content.json
            agent-version-content.json
            images.json
            version.txt
            commit.txt
