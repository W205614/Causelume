name: causelume
services:
  app:
    build: .
    environment:
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?run scripts/init_env.py}
      APP_OPERATOR_PASSWORD: ${APP_OPERATOR_PASSWORD:?run scripts/init_env.py}
      APP_DB_URL: jdbc:h2:file:/app/data/causelume
      DEMO_URL: http://checkout:8092
      EVIDENCE_TOKEN: ${EVIDENCE_TOKEN:?required}
      AGENT_URL: http://agent:8091
      AGENT_TOKEN: ${AGENT_TOKEN:?required}
    ports:
      - "127.0.0.1:${APP_PORT:-18760}:8080"
    volumes:
      - business:/app/data
    networks: [business, evidence]
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 30s

  agent:
    build: ./agent
    environment:
      BIND_HOST: 0.0.0.0
      AGENT_MODE: ${AGENT_MODE:-offline}
      AGENT_TOKEN: ${AGENT_TOKEN:?required}
      EVIDENCE_TOKEN: ${EVIDENCE_TOKEN:?required}
      DEMO_URL: http://checkout:8092
      HOLMES_URL: http://holmes:5050
      HOLMES_API_KEY: ${HOLMES_API_KEY:?required}
    networks: [business, evidence]
    depends_on:
      checkout:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  checkout:
    build: ./agent
    command: ["python", "checkout.py"]
    environment:
      BIND_HOST: 0.0.0.0
      EVIDENCE_TOKEN: ${EVIDENCE_TOKEN:?required}
      DEMO_CONTROL_TOKEN: ${DEMO_CONTROL_TOKEN:?required}
    ports:
      - "127.0.0.1:${CHECKOUT_PORT:-18761}:8092"
    networks: [evidence]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  holmes:
    profiles: [holmes]
    image: robustadev/holmes:0.46.0@sha256:bec9d14eea6a8890ba498c91ab47adcce3af9b6d0c6ee26d642d4e3e0df6218e
    entrypoint: ["python", "-u", "server.py"]
    environment:
      LITELLM_ROUTE_ALL_CHAT_OPENAI_TO_RESPONSES: 'true'
      OPENAI_BASE_URL: https://api.openai.com/v1
      HOLMES_CONFIGPATH_DIR: /etc/causelume
      HOLMES_API_KEY: ${HOLMES_API_KEY:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EVIDENCE_TOKEN: ${EVIDENCE_TOKEN:?required}
    volumes:
      - ./agent/holmes.yaml:/etc/causelume/config.yaml:ro
      - ./agent/holmes_read.py:/etc/causelume/holmes_read.py:ro
    networks: [evidence, model]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/healthz',timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 40s

networks:
  business: {}
  evidence: {}
  model: {}
volumes:
  business: {}
