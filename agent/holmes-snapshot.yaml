model: openai/gpt-6.1-sol
api_base: https://api.openai.com/v1
max_steps: 4
toolsets:
  bash: {enabled: false}
  confluence: {enabled: false}
  connectivity_check: {enabled: false}
  core_investigation: {enabled: false}
  internet: {enabled: false}
  kubernetes/logs: {enabled: false}
  skills: {enabled: false}
  causelume_snapshot:
    enabled: true
    description: Read the immutable checkout sample attached to this investigation.
    tools:
      - name: checkout_metrics
        description: Read sampled request and HTTP 5xx counts from this investigation.
        user_description: Read frozen checkout metrics
        command: >-
          python -c "import sys; sys.stdout.buffer.write(bytes.fromhex(sys.argv[1]))"
          '{{ (request_context.headers["X-Causelume-Metrics"]) | urlencode }}'
      - name: checkout_logs
        description: Read the latest failed checkout request from this sample, if present.
        user_description: Read frozen checkout logs
        command: >-
          python -c "import sys; sys.stdout.buffer.write(bytes.fromhex(sys.argv[1]))"
          '{{ (request_context.headers["X-Causelume-Logs"]) | urlencode }}'
