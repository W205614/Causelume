model: openai/gpt-6.1-sol
api_base: https://api.openai.com/v1
max_steps: 4
toolsets:
  bash: {enabled: false}
  confluence: {enabled: false}
  connectivity_check: {enabled: false}
  core_investigation: {enabled: false}
  internet: {enabled: false}
  kubernetes/logs: {enabled: false}
  skills: {enabled: false}
  causelume_checkout:
    enabled: true
    description: Read the recent request window of the Causelume checkout demo.
    prerequisites:
      - env: [EVIDENCE_TOKEN]
    tools:
      - name: checkout_metrics
        description: Read request and HTTP 5xx counts for the current window.
        command: python /etc/causelume/holmes_read.py metrics
      - name: checkout_logs
        description: Read timestamped request IDs, status codes and pool events for the same window.
        command: python /etc/causelume/holmes_read.py logs
