groups:
  - name: service-health
    rules:
      - alert: ServiceScrapeUnavailable
        expr: up{job=~"causelume|example"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.service }} 无法连续抓取指标'
      - alert: ServiceHttpErrors
        expr: sum by (service, environment) (increase(http_server_requests_seconds_count{status=~"5..",service!=""}[5m])) >= 3
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.service }} 在五分钟窗口出现多次 HTTP 5xx'
