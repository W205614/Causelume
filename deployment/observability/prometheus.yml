global:
  scrape_interval: 10s
  scrape_timeout: 4s
rule_files: ["/etc/prometheus/service-alerts.yml"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: causelume
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/MANAGEMENT_TOKEN
    static_configs:
      - targets: ["app:9091"]
        labels: {service: causelume, environment: local}
  - job_name: example
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["example-service:8085"]
        labels: {service: example-service, environment: local}
  - job_name: observers
    static_configs:
      - targets: ["prometheus:9090"]
        labels: {service: prometheus, environment: local}
      - targets: ["loki:3100"]
        labels: {service: loki, environment: local}
      - targets: ["alertmanager:9093"]
        labels: {service: alertmanager, environment: local}
      - targets: ["alloy:12345"]
        labels: {service: alloy, environment: local}
