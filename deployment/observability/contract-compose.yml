# Ephemeral, independently named contract stack used by agent/verify_observability.py.
services:
  example-service:
    image: causelume-observation-example:fixture
    build: ./example
    ports: ["127.0.0.1::8085"]
    volumes: ["example-log:/var/log/causelume"]
    networks: [contract]
  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    volumes:
      - ${CONTRACT_PROM_CONFIG:?}:/etc/prometheus/prometheus.yml:ro
      - ./service-alerts.yml:/etc/prometheus/service-alerts.yml:ro
    secrets: [MANAGEMENT_TOKEN]
    ports: ["127.0.0.1::9090"]
    networks: [contract]
  loki:
    image: grafana/loki@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/contract.yaml"]
    volumes: ["./loki.yml:/etc/loki/contract.yaml:ro"]
    tmpfs: ["/loki:mode=1777"]
    ports: ["127.0.0.1::3100"]
    networks: [contract]
  alloy:
    image: grafana/alloy@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    command: ["run", "--disable-reporting", "/etc/alloy/config.alloy", "--storage.path=/tmp/alloy"]
    volumes: ["./config.alloy:/etc/alloy/config.alloy:ro", "example-log:/var/log/causelume:ro"]
    networks: [contract]
secrets:
  MANAGEMENT_TOKEN:
    environment: CONTRACT_MANAGEMENT_TOKEN
volumes:
  example-log: {}
networks:
  contract: {}
